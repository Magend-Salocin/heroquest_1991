# Publie la partie web (moteur JavaScript, sans rien du jeu d'origine) sur GitHub Pages.
# Ne se déclenche que si web/ ou la construction changent : notes, outils d'étude et doc n'y touchent pas.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'outils/construire-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deployer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node outils/construire-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
